[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentdesk"
version = "0.1.0"
description = "Confidence-gated intent routing for banking support queries, with a label-quality audit"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "cleanlab>=2.7",
  "skops>=0.11",
  "matplotlib>=3.9",
  "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
intentdesk-train = "intentdesk.pipeline:main"
intentdesk-app = "intentdesk.app:main"
intentdesk-route = "intentdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
